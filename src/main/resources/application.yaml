spring:
  application:
    name: motordepot

  datasource:
    url: jdbc:postgresql://localhost:5440/motordepot
    username: motordepot
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080