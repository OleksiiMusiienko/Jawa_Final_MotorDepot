<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Водители — Автобаза</title>
</head>
<body>
<a th:href="@{/}">На главную</a>

<h1>Водители</h1>

<p th:if="${#lists.isEmpty(drivers)}">
    Водители пока не добавлены.
</p>

<table th:unless="${#lists.isEmpty(drivers)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>ФИО</th>
        <th>Стаж, лет</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="driver : ${drivers}">
        <td th:text="${driver.id}"></td>
        <td th:text="${driver.fullName}"></td>
        <td th:text="${driver.experienceYears}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
