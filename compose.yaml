services:
  postgres:
    image: postgres:17-alpine
    container_name: motordepot-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: motordepot
      POSTGRES_USER: motordepot
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5440:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motordepot -d motordepot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: